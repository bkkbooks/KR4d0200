body:
  text: 浮山集卷一宋仲并撰五言古詩早起偶成晨光起天末微風動林杪披衣初夢回捲書倦清曉隱几欲無寐百念自憂悄簞瓢舊獨樂樂意今亦少豈但感時節政欲避煩擾我非斯人徒區區務自了寒食日歸吳興寄魯山風雲雖不定日雨亦易乾殘春猶凛凛助我朝食寒想見芳野田士女遊班班去者日以踈更為來者歡青紅間車馬日暮醉墦間題大明寺詩招提隱松桂逺在城一隅我來嵗云暮天寒氣象殊寓目得佳趣百念如滌除及此齋時鐘簞瓢慰吾臞丈室曦未來香篆沈熏爐聊施濟勝具未暇學跏趺緩步大明寺山光佳有餘郊原自春色物意如相娛習公四海士豪氣編虎須邂逅偶傾蓋清遊邀我俱相從得二謝笑語寄歌呼送大理金少卿赴闕以老成耆德重于典刑為韻兼寄呈刑曹徐侍郎霜餘日初杲遮留人擁道公來春向闌公去秋埀老公當侍丹墀正人國之寶行行那得留仍視玉堂草憶昔遊成均千言談笑成傑立羣雋上少日騰英聲大當持荷槖小當登蓬瀛戢翼久不振一旦朝陽鳴全璧公之歸有識為嗟咨外祠三拜命歷嵗艾且耆乘流與遇坎道在他何知汪汪波萬頃未許兒輩窺髙山列松柏嵗寒寧動色顔巷一簞瓢掩關養吾直紛紛聲利場時勝時奔北袖手了不關昻然見全德九重聖端拱慨念人材重澄清鴛鷺行拔尤鋤猥茸輔郡與畿甸連歲拜殊寵付君天下平民寃自無壅疇昔公何如盡讀天下書公今復何似未如張與于臯陶當日語一一皆世模但令犴獄空安用髙吾閭澆風昔未殄向隅或不免上心天地心哀矜用中典卿聯慎所付遂極天下選議讞聊小試經綸期一展指日公旋登政席仍樞庭坐令貧病士少慰身飄零問訊徐夫子起處秋安寧兩翁廟堂具那得長司刑錢檢法及代期以詩告别因次其韻昔年兩岸栁逢春正依依扁舟轉河曲風光隨處宜彈指嵗云何秋風橘柚埀折腰得斗粟未救臣朔飢儒宫一何有惜哉壯觀隳采采池中芹亂葑迷漣漪蕭條住槐市庭空蔓草滋丹艧墮煨燼草木含瘡痍永懷千古人雜佩思報之我乃但便腹未免兒輩嗤斯辰况多艱每懷廢晨炊疇昔請長纓唾手平龜兹西略收咸京北伐空鮮卑坐令王室尊國風無黍離力微不辨此千愁鎖修眉承惠謝微官一室投荒陂吳山險可攀吳水清可窺勝概苦邀豫投紱今去遲王孫定偉器尺璧無纎疵枯棊屢賈勇佳篇仍致師一日不會面悠悠勤我思大軸插牙籖細字攻毛錐朝廷羅羣公如君滄海遺勿學貧賤交自比山林姿誓將友麋鹿終焉寄鋤犁况君秀眉宇異世元紫芝新詩落我前醉眼眩珠璣言多意無他戀戀新相知男兒各行役盍簮寧無時期君在嵗寒素心無自違君看千年柏豈憚霜雪欺慎勿倚市門美貨當自怡懷璧忌暗投按劒古所悲吳門三年淹沖天在一飛征塗加餐飯秋晚多寒暉求仙豈浪語渺茫那可期行行快著鞭獻納黃金扉勿作兒女别淚下如綆縻我方戒多語念念知昨非恨無錦繡段酬君黃絹辭七月二十日過王村幾到岸遇和中襲明舟回相拉宿于陳氏庵中蚊甚盛逹旦不能寢畏暑肩暫息初涼戒我行王村去城市捷帆片時程到岸才咫尺兩君笑相迎回棹不自由劇談底裏傾却泊紅蓮渚支笻叩禪扄闤闠未有此一見心眼清日暮山蕭然風來竹有聲危亭仍解衣坐久太清生擕枕共席地醉言強作醒蚊聲喧不寐談餘已窗明他鄉各蓬轉易散難合并共居雖一溪相望南北城勝處偶同踐輕去寧無情殷勤拂素壁留詩當題名奉和陳德召遊惠山見寄三十韻飛埃喜汚人餘事忌挂眼酒浪緑可親山光翠相挽折腰素非願被面有餘赧從來萬事空此去百念滿恰憶兹山逰判作經年款駕言隨所如歌笑為君莞洗耳聽潺湲緩步踏􅑬嵼褰裳跨風磴捫蘿度雲棧禾黍豈離離棗下初纂纂川原供遐矚筍蕨中去莧桃李傾城姿松杉萬金産雪浪逗氷泉乳花浮玉碗相望一牛鳴不憚四牡痯層閣神所宅敗簷我將館心求千佛印手罷七年板勝槩何時無羈懷自悲澘小院昔徜徉東風未暄暖夜語聨僧榻晨炊共華饌羊腸一分襟鴈背幾折簡于今懷舉桉過公倦開盞早知玉樹摧不如春思短塵容久難贖樂事貧益罕佳篇分錦繡和氣回絃管差肩招隱些下視廣陵散指蹤去路迷加鞭客情懶誅茅行可卜鼓棹過幾返避喧諧良圖結鄰得佳伴萍蓬豈願餘斗筲未須算荒涼石徑深蹭蹬雲色晚歸鞅那得遲霜鬢侵韋誕與德召諸公遊惠山今五年矣死生離合何事不有吾德輝亦不意永辭泉下今日讀德召新句悵然久之又念離索之餘賡唱遂絶勉強和呈迫于韻險不能工也祝子權以詩見招勉繼其韻總角嗜學問于心期可收嵗月如逝水倐忽二十秋紛紛何所得俗士難與謀夫子四海士不數韓荆州摳衣一嘗會頗輕萬户侯祝子晚傾蓋緩急仍同舟偉哉廊廟器價髙自難酬相從半周星會别嗟何稠班荆此話舊落落志益修嗟我聞道晚僅脫兒女憂一斑幸時窺稍知辨薰蕕執經濫同席得子真良儔安得身為雲相陪汗漫遊茫茫水東注百川皆亂流駑駘飽束芻市者常易售借問諸夫子為功忌中休此語期同踐此外復何求送周元特侍郎守宣城西風迎公來東風送公去尚欲留朱轓公行不可住無酒對公傾有懷為公賦夫子文武資亦復廊廟具剛方仰術業坦夷見襟度青衫試州縣機鋒微已露吾意有不可萬夫挽不顧翺翔諸公間籍甚當時譽峩冠上烏臺直諫汲長孺風雲千載合冕旒一言寤凛凛議論餘可使淮南懼天威瞻咫尺政塗去跬步興逸頓言歸解佩苕溪路湖山聊寄懷詩書尚溫故中外豈不殊進退自餘裕宣城唇齒邦望公來何暮我飢我顰呻公飯公覆護舉首望旌戟指期詠襦袴平生觸邪手不難鋤弊蠧雙溪疊嶂間按堵百無慮坐席豈容溫當饋意久注獻納念伏蒲謀謨懷借箸行矣股肱良歸作腹心助要觀今周公聲名三吐哺便當侣夔龍何止冠鵷鷺自念接門墻連嵗忘羇寓鷁首明當飛驥尾何由附幾日復升堂青天披宿霧過鴈與來魚猶當奉尺素西去無多程不誦陽關句和何樞密題楚頌亭韻山林與鐘鼎各了一世緣千年眉山翁生氣猶凛然菟裘視陽羡賣劒將老焉此志空泉扄禾黍荒故園尚餘種橘帖會有異世賢西清廣川公文翰鬱雙全新篇來西樞句句清可絃廊廟須公歸寧容一壑専九重最深眷每轉從諫圜絶唱今寡和惜哉坡已仙回視楚臣些並馳爭孰先况復黃絹碑光耀荆溪邉此亭會不磨名與兩公傳幾株羅瀟湘便覺饒風煙不比濯錦江榿木須三年行矣涼飈起霜滿千崖巔香霧噴四坐滿引杯埀蓮同祝子權遊虎邱出門迎朝暾入門餞夕陽豈願從吾駟聲名跨楚梁明日聊與君褰裳陟危岡方舟轉河曲薰風度微涼細看槐栁暗稍覺薝蔔香天髙散霞綺雲淨呈天光梵宫占地勝古木參天長禽鳥亦自得鳴呼聲激昻緩步信擕笻清流足飛觴乃知聲利役脫去非無方所憐雄麗地千年隴樹荒石頑尚莓苔劒逝寧光芒自今一瞬息江山幾興亡我衰漸落寞樂極淚淋浪寄謝同心人無驚鬢毛黃志師自通州訪我于儀真因擕之至長蘆留語數日及其歸也作詩以送之通州瞿曇師多于雁鶩行吾常愛志僧謂之一鳯凰不見十五載訪我大江傍留之固未遣載以荆州航相從三日遊山晚松風長爾我豈其夢嗒然堯桀忘凌晨洗一鉢束衣還故鄉為子植梧桐何時復來翔舟過仁王寺因口占一首平野緑逺近晴山翠縱橫西風今日涼天意濟此行居士十日病快意身已輕逢寺聊少憩山僧苦相迎豈為餘事來泉石鍾吾情風生本何意松篁得之清向來城市口無此笙竽聲坐久百念歇一雨秋意生所恨二三子無懷可同傾少日戒客氣四十猶未平一事一錯誤百年幾折肱不如謝公等窮山掩柴扄鄭漕生辰代幾先作至公無轍迹萬變歸諸正誰云學則然要在成以性我公鍾間氣異稟剛且徑一毫不容私心境自澄映超然是非表燭物眼常淨還將溟渤量一了百川競由來仁者夀兹理天所命欲知椿齡永視此寬平政桂華弄小春晚香適再盛年年幾望月影泛杯中聖尚書心如水逺裔有餘慶鄭相也何以繼清風家聲南北鄭戲李彥平李德卲人生貴適意自苦良亦癡百年同夢幻富貴安所施我生世緣薄疲弱不可支紛華豈不佳自覺心已辭歸來時自笑撫手長嗟咨人生行樂耳勳業知何時兩李近豪放髙懷不少卑謫仙已云殁流風宛在兹平子韻絶俗豪逸真吾師萬事一粲然不復論成虧邵公蘖菴下操心常苦危易象魯春秋憂樂常相隨端居談利害羌夷可鞭笞近亦能稍稍笑語隨兒嬉平居如二子廊廟真所宜人豈不自省何必求蓍龜漫遊恐未免慎勿差毫釐世事足反覆紛紛盡如斯錯固不足道誼也亦為之請復銘座右政可為吾規前言戲之耳未來容可追七言古詩元宵微雨十六夜雨止見月燈火千門競是日出户黃昏雲抹漆夜光乘暗何處投冷淡行人悵如失明朝風清天動色雲隂初若龜兆坼須臾白盤升天東相如歸來更全璧舟行用前韻懷祝子權楊枝巧作腰支弱不分小桃紅入萼風光向人但嫵媚客子那知行路惡短篷蕩漾晴波裏取次茶深酒薄薄所思故人殊未來悲風為我生絶壑塵沙隔年不相見結鄰空記他時約相看一字不寄將剩有新知豈云樂眼前俗士敗意耳憶君嵗嵗空牢落炯炯眉目端可思月照西廊暮雲廓建昌守楊吉老得居湖州山間作亭于上名曰辨輝為長句以記之白首苕溪幾我鄉青眼辨山如故友誅茅晚嵗合巖棲漂梗一生嗟浪走往往每來每太息去去一步一回首簷楹之雄誰氏室基堂宜為後人有榮華謬作長久計蕩盈要以仁誼守室空無人人不問天固遺公公信否輪奐雅宜鳯池人權輿本自鳯池手付之勳閥可無憾會與令名俱不朽雅懷卜鄰非卜居囂塵可暫不可久新亭嶻􅑖城之巔佳致回環天所就與山似有他年約相嚮每為長者夀碧鮮蒼潤被草木暖翠晴光排戶牖時復一觴澆磊磈下視羣峯皆培塿乃知韞玉山有輝更覺看山公不負向來曽試西垣䇿只今聊綰南豐綬胸中水鑑極涇渭筆下瑰辭粲瓊玖傾蓋視我平生交曳裾陪公衆客後喜見成都宅一區恨無負郭田數畝去住還當慚二老窮獨已復成一叟門前剝啄非他人我來問字不載酒陳行之得之因震澤舊居闢小閣面列洞庭山客有名以尊經者江都仲某為長句以紀之洞庭之野排千巖陳子卷簾非愛山震澤之流清沒底陳子憑欄不觀水傑閣橫空一事無終年傳習唯父書乃翁平時束五傳絶人偉論驚諸儒至寶不受久埋沒近者私記刋吳都搢紳駢肩快先睹一言價重百車渠正派源流要有自二難秀發名家駒少小辛勤門户計皇天有知子不孤于今三十五經立亹亹雄辨來起豫不但家法傳羣紀經學當與心法俱溪山相對無浪語寶此一編時卷舒自憐早嵗已漂泊乃翁邀我來僧廬于今塤箎弦誦地當時從容談笑餘契闊死生三十載萍浮蓬轉常﨑嶇子能箕裘萬事足其他得喪爭錙銖凛凛清氛端可想神逰髣佛歸來歟避暑報恩觀萬家九陌車塵中丹甍碧瓦真人宫回廊小院略具體清風爽氣無能同殿簷密有杉松護炎蒸縱酷來無從偶因謁客凌晨入歸徑往往侵昏鐘道人坐穩知樂否我生半世猶飄蓬茅簷與此異寒暑分毫不透東南風外舅莊子尚生辰荆溪之山環千峯摩空巉絶相爭雄與公萬仭俱壁立祇有爽氣蟠胸中荆溪之流碧滿野寒光秀色兼天㵼與公雅量相對清更覺波瀾來筆下髙門懸弧此日生少年揮毫敵兩京當時紫宸初射䇿玉色臨軒知姓名一旦橫經向儒苑鳯掖鑾坡去非逺如今髙臥尚琳宫主父嚴徐見何晚向來皂蓋先一州龔黃已往無此流旰食我皇收士急未容獨樂林泉幽華堂宴笑春風裏水緑山青助公喜三槐功就却歸來夀如此山如此水代人上師垣生辰三首玉帶金魚衮繡光維垣一旦侍君王埀紳廟堂調玉燭能使天公時雨暘疇昔干戈嵗屢歉于今萬室盈倉箱天心人意若相語問公何以回穹蒼天惡人心二三德公惟一德妙贊襄夜半熟視璿霄象紫微列宿相熒煌甘露醴泉不足瑞但欲嵗嵗占農祥物阜人嬉了無事斯民擊壤君埀裳時時公亦憩傑閣萬物欣欣春晝長當時尹躬似今日但欠昭回雲漢章天寒嵗律今峥嶸御街鐘鼓天初明近臣日報君顔喜問寢慈寧聖主情萬年泄泄融融樂此事無與凡公卿父老問某何臻此天子用孝公用誠向來瞻雲一萬里鴈書不到江南城初決和戎蓋公䇿來歸騶馭人歡迎九重日奉天下養禁苑蟠桃春自生當時若用他人説至今未見風塵清前代功臣豈不有未有髣佛公勳名封人考叔陋籌䇿區區但捨君之羮化工作意辦春來斗柄明朝後日回東風先到江南岸江山濯濯無塵埃靈光蔥蔥隨處有夜半兩兩明三台天遣異人為時出要作霖雨澤九垓明堂藉此一柱壯他山之木皆凡材如今國勢盤泰華向來天步屯雲雷嵗嵗年年競是日人人爭欲持夀杯天知調羮付公手江梅不為他人開長生唯在一清淨别無方丈并蓬萊沈正卿得男以詩慶之乃翁壁立千仭餘乃翁摛章錦不如英風雅韻來無盡川媚還復生明珠華堂寧無侍巾櫛娉婷試問誰家姝嬋娟深鎖人不見忽驚清曉懸門弧聞是髙秋生驥子充閭喜氣相縈紆大父大母顧之笑乃翁再拜為親娛公家餘慶得英物渥窪自有名家駒摩頂尚記前生誤墮地舉手一笑俱夙習如斯定夙寤少小便應傳父書公卿衮衮自今始行矣家慶端可圖佳辰清樽來賔友母愛子抱集坐隅臭味芝蘭席上客為公贊喜容歌呼我衰我倦毋多酌老矣醉倒須人扶留取明年會湯餅要看徐卿第二雛五言律詩詠竹自結髙人伴雅無俗士緣驅之傍城市徑節非所便未論傲霜雪試欲藏風煙願留舊青眼嵗晚相周旋遊靈巖詩古寺青楓外平湖暮靄西亂花經雨薄冷蝶趂人低俯檻留連語聽禽自在啼風光兼客恨樽榼故須擕移舟晨鼓鬧泊渚暮鴉盤夾岸栁渾暗橫軒梅半殘最憐春日薄猶動客衣寒樓外西風急雲湖看湧瀾舟行再用前韻一棹苕溪去千門榆火新老來猶是客病起怯逢春儒館妙人物吟毫泣鬼神平生經濟業勉矣正逢辰行藏那用卜皺面不重紅又作都城别長懷國士風折巾從有道斗酒對無功一夢何時續南窗笑語中覺華山居三首竟日人聲斷空山一二家猶憐中夜雨不礙曉來花健飯蔬如肉衝寒酒當茶飛潛各有性貧樂付天涯舊雨無人到非緣今不來蔬盤春後足經卷粥前開燕語緣人去禽聲逐夢回勤披頻得句隨量日持杯倐起郊扉念亟回朝市轅君恩如父母山逈亦乾坤援筆醉醒語擕笻前後村是非襟度外客至總休論嵗晚泊姑蘇用吕居仁舍人韻二首寄孟信安斷岸留孤棹層臺聳近城鴈傳他邑信鷗背去年盟幾片雪多思一枝梅有情何人在樓上吹笛暮寒生睡穩窗遲曉愁多鬢易秋秪堪浮小艇不擬上西樓無盡江山景須陪杖屨遊一區何日辦孰為我公留泰興道本上人少時頗留意詩律已而遍歷諸方卒無終嵗之寧今埀五十矣自淮鄉過余于吳興翌日來辭曰道本欲自越趨天童或自溫趨江心問道于覺了二士覺為橫智了為真歇願聞一言為書五字詩以送之芒鞋亦良苦歧路不曽休句律可青眼宗風已白頭舌端頻自味心外更何求欲寄明年信溫州定越州韓侍郎帶礪元勳後熊羆吉夢初祥煙輝户牖喜色動門閭丙魏功行致韋平慶有餘願言椿算逺二十考中書社稷中興際朝廷憶老成我公傳祖烈美譽冠時評相業光三世官聨且二卿宸心方眷倚行慶秉鈞衡送致政節推朱子發歸無錫二首白髮倦場屋一官初自娛幡然挂章紱遽作卧江湖耆舊添佳傳都門續故圖會當埀不朽名與惠山俱雞栖朱伯厚來葉尚多賢吏案儘紛若心田正坦然林泉誰共樂衣鉢子能傳會有蒲輪到朝煙夕靄邉送泉州周尚書閭里推耆德門庭只故居綺羅看富室丹碧衒新廬潤屋寶非璧滿車家有書功名宜嵗晚帶玉綴金魚常若侍君側寧論去幾程政須懷宿望寧得殿名城執手欲何語諛公恐不情斯民艱食甚第一勸春耕得譽今銓管飛聲自諫垣久知蒙帝可不敢喪吾存切切道塗喜勤勤指顧言我公今氣貌猶是舊攀轅别公今夜月恰可一庭方勇往先過建徐行不到漳同時三郡樂指日四時康勝地豈云逺吾當騑乘黃身外從紛若胸中固卓然險夷唯故步舒卷只遺編錦繡文千段珠璣詩幾聨我公今愈健筆力敵中年送張持國省幹歸山隂三首臭味張公子生涯類我貧又為兩鄉夢看即一朝紳洗眼千巖秀抽身肥馬塵他年乘夜雪從子剡溪濵稠衆相從地無言意已傾余方厭藜藿子肯扣柴荆短棹起歸暮長亭如别情回頭聽羌管拍拍喚愁生埋輪賢使者重席老先生一别遽多嵗相望無幾程到家乘暇日為我話深情欲寫相思語昏花字不成送劉大諫赴漳州四首兼寄建州太守趙左司海內聲名滿溪頭且寓居曽來非俗客亦愛是吾廬逺道勤為問平時懶作書郡樓間極目細看北來魚南國踰千里西風幾十程凌寒初引道投老試専城貧賤荷公意分擕如此情書來何處問南浦寄深耕胄甲漢中壘聲髙昔諫垣幾年清議在萬事此心存臨遣再三意褒嘉數十言疾驅公未可半路趣回轅安穩甌閩路介居天一方雙旌誰出守八郡莫如漳日月中天近風霜去路長相知惟白首端冕拜清光代人上叔母張氏生辰三首雲漢良辰近秋風一葉初祥光連户牖喜色動門閭蘋藻儀無間芝蘭慶有餘仁人宜上夀不必問瀛居仙閥流芳逺吾門襲慶長萱堂今夀考樞府昔輝光玉樹諸郎秀金花寵命昌欲知椿算久辟榖有家方憶昔觀光際溫顔獲屢親奬提煩叔父駑蹇負前人幸會逢今日飄颻愧此身捧觴陪子姪深覺仲容貧
