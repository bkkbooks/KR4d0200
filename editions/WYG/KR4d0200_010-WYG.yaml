body:
  text: 浮山集巻十宋仲并撰雜著祈雨文禾棲南畆竚期倉庾之登雲密西郊盍慰田廬之望演秘言於琅笈輸誠意於璿穹念此吴人力於農事寧婦子而盈百室所望有秋先公田而後我私尚資一雨伏願興油雲於反掌霈膏澤於崇朝潛消螟螣之災畢刈茨梁之稼仰祈天鑒曲徇民言謝雨文周雅之歌有年方切農夫之望魯史之書不雨實為守土之憂敢先事而致祈乃指期而獲應油雲晝合膏澤夜零慰我民心孰非神力邇遐共慶已卜千倉之稲粱稚耋相呼預圗九月之場圃尚終此恵黙相其成祈晴文三農畢務萬寳告成天既錫之豐年人方仰以卒嵗遽淹常雨尚稽倉廪之登少豁隂雲庶慰郊原之望佛慈甚邇民力可哀俯竭忱誠仰祈鑒佑保嘉糓於埀成之際在覺力固非甚難困斯民於多難之餘宜天心有所不忍又占星授時農事初勤於東作力田望嵗民力共效於春祈念此積隂殆踰旬浹農末皆病閭里大嗟舊雨復今雨而相仍元日至人日而未已䖍趨梵宇祗叩覺乗冀慧照之普臨擴洪慈於埀佑頓消氛翳旋睹清明歸行潦於百川既升景日歌大田之多稼共樂豐年又萬寳得秋已卜倉箱之慶三農望嵗竚看場圃之登于彼郊原奄觀銍艾大田在望苦雨奈何冀恵日之照臨豁重隂於指顧時止則止曰暘而暘瞻霽日於東隅民應相賀起多稼於南畆嵗以無憂又寳稼盈疇方切秋登之望氷輪離畢遽為夏耨之妨積雨奈何提封告病隔四山於煙靄之外掩千塍於雲水之間仰叩覺乗䖍趨梵宇時止則止曰暘而暘庶資藉於神休用慰滿於人欲披雲共慶收行潦於崇朝擊壤同歌占大田之有嵗又斗覆嵗穰雖莫窺於洪造角見雨畢亦終賴於殊休爐熏徹而帝意孚梵唄聞而神釐格旋覩雲隂之解駁頓瞻天宇之清明且舞且歌是穫是刈惟甫田之在望迄用康年豈覺力之敢㤀有如皦日又寳稼盈疇方切秋登之望氷輪離畢遽為夏耨之妨兹煙靄之晝騰已峯雲之夕斂憂寛守土喜浹提封尚念有秋曽無㡬日冀覺慈之終恵訖隂相之前功萬物之生得宜方逢盛旦五者之來以叙庶格豐年代平江守勸農文阡陌連亘土壤膏腴厯觀數郡之間未有此邦之盛雨暘時若禾黍嵗登今即郊坰仰遵詔㫖田疇在望父老具來非曰務為美觀盖将求乃實效天時地利要須人力相扶春耕夏耘然後秋成可望其躬率於子弟亦轉語扵比鄰仲春事于西疇兹惟時矣平旦坐於左塾相與勉之勿辭風塵雨露之勞各為父母妻兒之計當分隂之是惜庶數口之無飢其或惰農有罰勿悔囬孟郡王姻禮書五世並于正郷無假龜人之卜一女不與凡子自憐處士之心敢謂宗工不遺衰系甫遂絲蘿之託洊頒箱匪之豐合好千秋納成今日顧憔悴何以稱此况戅愚僅若而人職替公宫慙匪有齊之季女光生蹶里佇看迎止之韓侯仰望終身欣榮之至荅孟郡王姻事報日書伏承卜兹柔日賁以華牋至于再至于三方懼猥辭之瀆迨其今迨其吉欣惟嘉命之承為五弟問姻王氏書必恭桑梓孰先父母之邦薄采蘋蘩莫重春秋之事兹圖合姓仰恃通家某第五男顓蒙何取於鄕評伏承令女二小娘子婉娩無㤀於姆訓豈韋布敢求夫佳偶顧萍蓬久藉於餘光風土異宜無若鄕閭之舊蓍龜協吉遂㤀門户之微庶幸俯從益敦永好為妹回蔡氏姻定書蟬聫華胄世久襲於金貂萍泛寒蹤身粗安於蓬蓽敢圖姻好偶契夤緣某第幾女子姆訓無㤀苐習勞於機杼伏承令似從事家聲是繼寖騰譽於簮纓聞命行媒增輝蔀屋遂松蘿千秋之託願拜嘉音盛羔鴈五兩之儀益欽雅眷有少回禮具列别牋子舍姻定書漢列留侯久聲猷之未墜周歌山甫今苖裔之遽㣲妄議姻聫敢㤀族系易簡愚弱未冠唯翰墨之服勤伏承某人婉嬺方笄早閨闈之毓秀敢徼福於先世用納吉於華宗五世正卿信媯姜之協吉一鄕兩姓庶朱陳之復生豈無他人其惟大援代為外孫女孟氏作姻事言定李仲簡書白也之思飄然久馳雋望三桓之孫微矣猥辱佳音龜筮協從室家相慶某人女功是習婦禮何知伏承某人譽著虞庠名優漢殿荷一介行李之至得五世正卿之家愧我好逑偉兹吉士春風得意云初僊桂之攀末系生輝永遂女蘿之託代王氏姻禮書初求大援非吾偶之為慙適兆和鳴豈人謀之及此乃以衰系獲締華宗古所重者繼世承祧頃既陳於問名納吉占期伊邇候已覿於三星納幣有稽儀敢望於五兩代人姻事定書婚姻劉范求平時臭味之同閥閲崔盧孰若我鄉閭之舊敢徼福於先世用増耀於衰宗某人子職之餘粗習前人之詩禮伏承令女姆訓有自不㤀女史之箴規頃問名於行媒許合好於二姓一溪共住匪宋逺跂予望之盡室均歡㤀齊大非吾偶也有少禮物具如别牋代石仲澤姻事定書正婚姻而辨姓将繼嗣於前人申媒妁以問名宜率循於古訓某第幾男某年齡鼎富伉儷求諧適兹筮仕之初思得承家之助伏承令女温恭而孝柔静以和雍容環佩之儀窈窕閨闈之秀拂龜考吉協鏘鏘鳴鳯之符占星問期正灼灼桃華之候相我宗事無易淑姬矧三遷方藉於鄰光而九里獲霑於餘潤荷親情之有素宜姻好之相求結援髙門儻遂絲蘿之託來宜私室載賡蘋藻之詩百金何言一諾為望
