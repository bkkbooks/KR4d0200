  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0200_WYG_003-1a, image: WYG1137/WYG1137-0809a.png}
body:
  text: 浮山集卷三宋仲并撰五言排律用孫仲益尚書韻二首呈孟信安士仰韓門重身髙謝傳班文看輝北斗人望起東山絳灌庸奴爾臯夔伯仲間自天芝檢下指日衮衣還片語鳴丹鳳羣爭息左蠻時雖容下客勝處一窺斑慷慨安周鼎從容却郢兵馳心子牟闕袖手闔閭城前箸陳天陛先聲震敵營寰區望彌切樞管寄非輕行有絲綸詔寧終鷗鷺盟一舒經世䇿遐邇頌升平鄭漕生辰象緯祥光動門弧瑞氣盈小陽春在序幾望月偏明他日三千牘清時九萬程名因使粵重功自備吳成偉量溟波濶竒詞錦段呈褒揚看唾玉輕重倚提衡松柏真難老芝蘭足後生筍班行趣召金帶已先橫內史言何美謂鄭當時尚書心自清謂鄭崇祗應南北相謂鄭絪鄭餘慶重振舊家聲唐大夫生辰氣轉初寒候祥開既望辰應時來鸑鷟占夢獲麒麟盛德圭無玷髙才竹有筠胸襟藏巨壑人物妙洪鈞使者光華逺朝廷寵數新鵬程九萬里椿幹八千春鼎鼐虛前席風雲即要津黑頭紆衮繡天意在斯民陳漕生辰代楊文作六管陽初復前宵月尚圓長庚俄夢李嵩嶽故興宣國使新恩數忠臣夙眷偏節龍開逺目衣繡聳華年日月聲名起風雷號令傳自應威動嶽曾是力回天相國關中粟尚書地上錢委藏淹府庫飛挽亂車船南獠元歸地西方正拓邊定知新將飽尤賴我公賢赫赫蘭臺舊飄飄鳳沼仙終焉還魏闕聊爾駐荆川曲學聮珠履非才汙彩箋千秋期鶴夀萬里附鵬騫耿憲生辰象緯祥光動門弧瑞氣纒秋來孤鶴健霜近古松堅鄰境兵戈盡新恩雨露偏軺車猶問俗寶帶獨優賢投筆男兒志封侯烈士年老成端可恃終冀勒燕然五言絶句對竹嶔岑何處峯來伴蕭踈竹悠然方丈間寄此千里目假山峯間碧琅玕清風五月寒欲題無好語支枕卷簾看七言絶句官滿趨朝留滯吳門即事書懷十首十載錢塘雲漢間江聲夢裏聽潺湲他山縱染千尋碧不似西湖一帶山水邊梅栁倍精神總趁晴天作好春多謝東君惜花意不教風雨廢芳辰小樓嶻嶭亂山橫獨倚朱欄度晚晴忽聽如簧語音好祗緣髙處最宜鶯枉費花工著意催漫山桃李總非材要令千古芬香在能作和羔自有梅花徑風來百樣香捲簾春水緑池塘如今萬事銷磨盡四卷楞伽味最長春服何當詠舞雩鳳池今是魯真儒向令未解邊城戍能對東風一笑無錦帶吳鈎輕薄兒三三五五競花時太平樂事從誰得費盡經綸爾不知門外煙花看不厭東風故為客開簾如今樂極思疇昔長是春深未解嚴燕羽差池何處歸銜恩春傍主人飛定須借與一巢穩十載飄零事事非裁剪羣英荷化工間中無計答春風自鋤花徑平如掌要使荆榛一掃空平江守禱晴即應時近元夕矣寄呈五絶句丹邱雨裏看春回密霧濃雲撥不開怪底寒忩烘曉日朱轓親禱梵宫來投曉家家笑語聲夜來風促雨如傾都緣默禱胸中久一瓣香焚喚得晴梅經多雨玉飄零就有殘枝困未醒安得吳儂不歌舞滿畦扶起麥青青東風吹斷雨如繩一夜仍開曲沼氷便試元宵強半月孰知天意欲催燈安排燈火作鰲頭人樂公來再有秋轉雨作晴談笑事他州誰得似吾州夜抵德清縣偶題溪山奪目壯哉縣風露侵肌老矣身斷岸橫舟偏得月小橋曵杖不逢人再過宜興舟中見芍藥數枝憶淮鄉此花之盛為之悵然輒成三絶故眼相看未作踈平生風味是吾廬娉娉裊裊誰家子浪説傾城總不如少時暮暮復朝朝一水相望恨未消岸曲橫舟試回首隔簾斜立數妖嬈却是溪頭消息真故園十載漫風塵如今不問黃樓子淺白輕紅自可人淮鄊芍藥號黃樓子者最勝邦人重之薄暮逰潘登仕園園有堂三間榜曰一枝蓋湖公樞密兩取莊周郤詵之語既以嘉潘亦以勉潘之二子因用其意各賦一絶斜忩短屋傍殘暉宴坐蕭然老布衣枯淡生涯一枝足世間驚鵲誤南飛玉樹郎君兩白眉照人英爽自兒時乃翁可笑太多事繞舍春風千萬枝蕪城鶯歌燕語戲晴暉日暮行人緩緩歸十里蕪城春色晚回頭往事已全非有客來從陽羡聞元績離家已月餘由崑山過臨安桐廬計今合歸矣元績當不惜迂路一訪僕於苕霅間也戲為一絶招之元績純孝人每在道念親殊切風露侵人曷往哉白雲飛處棹徘徊平時識面盡經過莫為茅簷偏不來感時傷春那得易為情世味年來一一更馳馬彎弓今日事儒冠深覺誤平生忽傳羣盜下淮瀕又逐黃州韓使君却望長安在天上愁看天際有孤雲晚坐和韻急雪逢春易作晴窮閻猶復斷人行公家何在欲乘月夜半扁舟不隔城好月侵階已十分太清不受一塵昏今宵定自梅花發踈影橫斜何處村篇篇振玉妙玲瓏字字春風和氣中安得居家無一事搜吟日日與君同醉眼全醒病亦醒虛齋危坐聽無聲錦囊欲報清新句自笑常談只老生城東韓李城南趙欲往從之道阻長與去聲我詩盟煩借問角弓永好願無忘次韻病起二首不妨佳句太頻頻還得愁中眼漸明好是維摩病初醒又將口業起紛爭聞道車書未一家平時苦苦念京華新來忽得幽居味竹屋茅簷政自嘉送閻少隱同其弟伯子宣子赴試淮南為一月之别某以病起不及餞送為三絶二難晚出材無敵老將從來勇冠軍一月望公三捷至秋風不惜暫離羣街頭日夜催槐黃去去歸帆如許忙我病公行欠巵酒少遲飲至共傳觴扛鼎拔山誰長雄八千號數誇江東公家子弟又可用要與父兄成大功題章伯深臞怪圖竹户茅簷一徑斜清樽黃卷定生涯溪山勝處春長在却放朱藤一半花杖策山隈亦水濵間中未害飽經綸何曾寂寞嵌巖裏慣著風流廊廟人畫枯木乞與空齋伴我間風霜諳盡各蒼顔不妨黛色凌雲幹蟠屈生綃尋尺間次韻耿薦可催菊三首黃花應自惜離披欲放清香故故遲病客髙眠防不肯賸裁好語報花知銜杯采菊久尋醫白髮蒼顔漸可期凖擬新來強作意又從愁裏過花時年來花意亦難猜陶令東籬獨未開伴賦落英吾豈敢狂言聊復為君催黃兵部生辰中朝人物競推先富貴前塗看永年九萬里程飛正逺八千春幹久彌堅南國初持使節回斑衣仍把錦新裁大椿更向萱堂祝長到春來共夀杯蚤嵗蜚聲應宿郎至今雞舌尚含香未應駟馬誇流俗只為慈親樂故鄊地上泉流府庫充艱難天與嵗時豐他時若論關中漕合數蕭何第一功詩餘憶王孫秋閨庭梧葉密未驚秋風雨瀟瀟特地愁愁緒如絲無盡頭思悠悠悵望王孫空倚樓點絳脣贈外孫猷秀出羣兒栁眉濯濯春庭院不親歌扇弄筆勤書篆翁已無能老退慙頳面欣同宴坐來喜見痛飲驚無算浣溪沙春閨即事淡蕩春光寒食天玉爐沉水裊殘煙夢回繡枕隱花鈿海燕未來人鬬草江梅初過栁生煙黃昏踈雨濕鞦韆前調示孟氏女舉案家風未肯低清心端自秀深閨芝蘭玉樹寧馨兒蚤嵗女禪靈照女靜中經卷手常携聲名要與斷機齊又雅稱詩人美孟都清新幽韻比來無新來學得繡工夫經卷但知從阿母醉來翁已要人扶尚能把盞勸屠蘇前調和李達才韻説似當年老季倫君家雖富客常貧何曾一笑任吾真酒滿罷留天下士詞新空賦坐中春誰能絶筆更書麟菩薩蠻和趙有逸坐上韻宛如姑射人氷雪知公不負佳風月莫放漏聲殘清風生坐間賞春心未足翦盡尊前燭此樂自難忘一觴還一觴好事近宴客七首時留平江俾侍兒歌以侑觴二陸起雲間千載風流人物未似一門三鳳向層霄聨翼貞元朝士苦無多公今未華髮重向紫宸朝路立鵷鸞前列右朱參議今古滿胸中韜略一時人傑髙臥溪山好處遲十年齋鉞朱轓休傍武陵溪梅花記曾别蚤晚殿前歸侍總周廬千列右劉鼎州淮上五分符名在圖書東壁坐對書成多暇寫青箱千帙一杯先為祝東風丹詔來朝夕何處稱公揮翰定北扉西掖右鄭直閣閥閲盛中州冠冕共推華族耐久松筠交契更襟懷金玉諸儒皆自愧盧前小試暫符竹行看世官入踐繼西樞前躅右盧楚州分手又三秋猶記花時歌别每念征帆歸晚誤五湖風月清江休望使君來指日趨天闕壻玉翁氷相映看紫薇花發右朱臨江襟韻絶􅊏塵炯炯夜光明月合是紫荷持槖侍丹墀清切暗香踈影想公家人與梅超絶酒罷帝城蚤去占百花先發右林刪定今雨幾人來氷霰更凝寒色門外車多長者頓光生蓬蓽繽紛飛雪更初梅特特為留客惟恨坐無華饌只平時真率憶秦娥木樨隈巖側怪生小院香來别香來别嫩黃細細商量齊發佳人斂笑貪先折重新為翦斜斜葉斜斜葉叉頭常帶一秋風月畫堂春和秦少遊韻春波淺碧漲方池池臺深鎖煙霏緩歌爭勝早鶯啼客忍輕歸合坐香凝宿霧墊巾梅插寒枝漸西蟾影漾餘輝醉倒誰知大聖樂令贈小妓豆蔲梢頭春正早斂修眉未經重掃湖山清逺幾年牢落風韻初好慢綰埀螺最嬌小是誰家舞腰裊裊而今莫謂春歸等間分付芳草浪淘沙贈妓趁拍舞初筵栁裊春煙街頭桃李莫爭妍家本鳳樓髙處住錦瑟華年不用抹繁絃歌韻天然天教獨立百花前但願人如樓上月三五團圓又傾國與傾城裊裊盈盈歌喉巧作斷腸聲看盡風光花不語却是多情家近董雙成三妙齊名誰教蜂蝶漫經營留取無雙風味在真是瓊英前調即事草聖與詩餘清韻誰如生綃團扇倩誰書月湛素華天似水深院涼初人散晚鐘踈後約還虛良宵忍放枕鸞孤要得相逢除是夢有夢來無鷓鴣天為鮑子山侍妾燕燕作小泊橫塘日欲斜一枝猶有未殘花幾年燕子無消息今日飛來王謝家歌水調韻琵琶聲聲都是怨年華叉頭杏子今如許翦燭裁詩莫問他前調贈外孫夔間世麒麟降自天光輝列宿燦初躔他年身致夔龍列少日心存翰墨邉簪綵筆照金蓮詞華當使思如泉未論聳壑昻霄事且與衰翁慰暮年驀山溪有贈氷清玉映自是閨房秀十里捲朱簾好紫陌家家未有天然情素髙壓一城春花艷麗日精神梅韻腰肢瘦曲屏虛幌枉著鴛鴦繡不是不相逢淚空滴年年别袖從他蘭菊秋露與春風終不似玉人人一片心長久水調歌頭趙制置見招歸用東坡中秋韻以見微意華棟一何麗移下小壺天幾多曲房新户縹眇似當年曽是使君風度元有胸中邱壑六月竹風寒一洗筝笛耳歌舞粲筵間座中客醒復醉聽無眠已回歸夢猶復嫋嫋記清圓尚想飲中仙子來處餘香飄座勝韻此雙全為寄月華語難與並嬋娟芰荷香中秋在毗陵不見月作數語未成後一日來澄江途中先寄趙智夫醉凝眸正行雲遮斷澄練江頭皓月今宵何處不管中秋朱闌倚遍又微雨催下危樓秋風空響更籌不將好夢吹過南州浮逺軒忩異日到山空雲淨江逺天浮别去客懷無賴凖擬開愁氷輪好在解隨我天際歸舟何須舞袂歌喉一觴一詠談笑風流八聲甘州木樨和韻正西山雨過弄晴景竹屋貫斜暉問誰將千斛霏瑛落屑吹上花枝風外青鞋未熟鼻觀已先知撓損江南客詩面難肥兩句林邊傾蓋笑化工開落尤甚兒嬉歎額黃人去還是隔年期渺飛魂憑誰招取賴故人沉水煮花瓷猶堪待嶺梅開後一戰雄雌念奴嬌冬至夜作灰飛嶰竹慶羣隂消盡新陽來復雲物呈祥連瑞靄煙氣紛紛馥馥紫陌香衢朱簷影裏羅綺花成簇嶺梅驚暖數枝爭綻寒玉有人裊裊盈盈今朝特地為我新粧束嬌倚銀床添繡線長喜修眉舒緑不道多情錦屛羅幌難得歡生足誰知今夜玉壺銀漏偷促前調和耿時舉賦雪韻江南春早尚餘寒門巷楊花飄逐一色初梅開盡也不數芳園紅緑珍重騷人幽懷分寄髙韻歌黃竹六花羞避滿箋凌亂瓊玉應念有客長安履穿東郭無與憐窮獨鼓棹前溪非興盡寒怯水棲巖宿咫尺君家瑶田無徑氷柱排銀屋甕頭春到喚回晚夢清熟前調王守生辰金縢事業慶丹青千載勳在王室聖主英明平萬國天産非常人物嶽瀆分靈熊羆符夢五百年方出致君堯舜要須純用經術須信鳳閣仙人風流文采藹家聲如昔獻納司存持禁槖合歷三臺清秩倦宿承明乞麾臨郡暫綴金閨直五雲深處一星今在南極瑞鶴仙春日詠懷試六花院落正栁綿飄墜因風無著吳王舊城郭記烏衣門巷小橋簾幕他州寥索漫等間桃英杏萼認幽香來處羣芳盡掩蕙心先覺行樂燕雛鶯友浪語狂歌休休莫莫蘭房繡幄添新恨念前約殢十分芳景十分春意休惜十分共酌任十分吹老寒梅戍樓畫角水調歌頭浮逺堂靜練平千頃華棟俯中流凌晨畫戟來看宿雨斷虹收八九胸中雲夢三千筆端風月無處快凝眸笑詠一堂上揮麈氣橫秋俯危欄紅日下暮雲稠無窮偉觀祇應天意為君謀容我時醒時醉獨泛微煙微雨浩蕩逐輕鷗不羡嶽陽勝丹碧聳層樓念奴嬌同上練江風靜卧氷奩百尺朱欄飛入江逺浮天天在水水滿半天雲濕白鳥明邊青山斷處眼冷江頭立月明潮上葦間漁唱聲急幾度吹老蘋花野香無數欲寄應難及天借詩人供醉眼尊俎一時收拾竹裏行厨花間步障風雨生呼吸酒闌歌罷釣船先具蓑笠
