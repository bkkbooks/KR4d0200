body:
  text: 提要浮山集十巻别集類三宋臣等謹案浮山集十巻宋仲并撰并字彌性江都人宋史藝文志載并浮山集十六巻而不為立傳其事蹟遂無所考惟周必大平園集有所作并集序稱并以紹興壬子擢進士第甲寅以丞相朱勝非等論薦改今秩尋補外去後三年丁巳復以張浚薦召至闕為秦檜所沮改倅京口自是閒退者二十年孝宗即位擢光祿丞出知蘄州所紀厯官本末頗詳然考集中謝宰相啟有黌序初除語則嘗為教官又原弊錄序自稱監臨猥局則嘗為監塲官又多與平江淮西南安建康湖州諸守臣代作表啟則嘗厯佐諸郡而必大序俱未之及殆以其無闗出處畧之也必大又稱并力排王氏之說惟孔孟是師其初任京秩時王居正所草制詞亦有學知是非邪正之褒而陳振孫書錄解題乃稱其官湖倅時為籍中妓作生朝青詞坐是謫官與其素行不相類頗不可解考集巾陳情啟有旁觀下石仇家謗傷之語意其即指是事歟又集中有囘孟郡王姻禮書郡王隆祐太后之姪孟忠厚也宋史外戚傳稱忠厚與秦檜為僚壻而檜實隂忌之又稱檜當國親姻攀援以進忠厚獨與忤王明清揮麈錄稱吳棫為忠厚草表因忤秦檜謫判泉州然則并之見惡於檜殆以孟氏姻黨之故竟以微罪坐廢也其古文頗髙簡有法度四六能以散行為排偶尤歐蘇之遺詩亦清雋㧞俗王應麟困學紀聞嘗引所作咏韋執誼不看嶺南圖詩政恐崖州如有北郤應未肯受讒夫二句以為誅奸諛之蕭斧然其詞淺露殊不盡并之所長應麟葢偶拈及之以為并詩止此則非矣據周必大序其集乃并外孫南安太守孟猷所編舊本久佚今採永樂大典所載排次訂正輯成十巻乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀浮山集原序江都仲并彌性自少卓犖不羣潛心學問力排王氏一偏之説惟六藝孔孟是師筆勢翩翩雋聲籍甚紹興壬子擢進士第髙宗方汲汲人才嵗在甲寅丞相勝非執政松年與一二侍從相繼薦對上一見褒賞特改京秩詞臣王居正草制云學知是非邪正庶幾孔子所謂可與共學者當是時人之期君君之自期皆謂公卿可立致或疑年少資淺宜試以事補外而去後三年丁巳丞相浚執政復以名聞召至闕而樞宻使檜頗不謂然君即移疾出倅京口自是棲遲閒退者二十年孝宗初元擢丞光禄晚知蘄州議論材畧既未盡見扵用而平生著述亦多散失外孫南安太守孟猷嗜學好修淵源有自裒成浮山集十六巻以序見屬予婦家扵君有連且嘗同朝熟其才華故樂為言之夫文體衆矣吟詠情性莫重扵詩仕塗應用莫急牋啟詩也者造意深則辭或齟齬次韻多則句或牽率君之古律如王良造父馭駿馬駕輕車有犇軼絶塵之勢其賡險韻如繭抽絲印印泥愈出愈新送妹長篇孝友慈愛溢扵言外殆欲上規風雅一何盛也其四六叙事雖閎肆而闗鍵實宻屬對雖切而非駢儷所能拘最後蘄州謝上表以古文就今體自成一家凡為國撫民據舊圖新之意無愧前哲此由學廣聞多非特天才駿發而已其他論時事條利害深切明白務在可行為莊安常行狀見謂三長雜著題䟦清雅可愛復以餘力出入釋氏遊戲歌詞無不過人夫其才學如此幸早為君宰所知而不得雍容禁省歌頌大業其命也夫雖然裕扵才者薄扵命文士常然獨君乎哉姑詳著以釋南安凱風寒泉之思云慶元六年七月旦平園老叟周必大序
