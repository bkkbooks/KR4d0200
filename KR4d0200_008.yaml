body:
  text: 浮山集卷八宋仲并撰啓上宰相陳情啓較錙銖於溝壑幾墜餘生瞻咫尺之雲霄仰祈再造恃公聽之在上持私悃而有陳飢寒之憂勢不得已進退之義懷豈無慙伏念某生而蠢愚熟於憂患詩書少日何知師友之淵源翰墨窮年空羡文章之光艷望外叨塵於末第生平顛躓於窮途循分茍安聊復擊為貧之柝指心自誓不敢執求富之鞭猥蒙交薦之書早冒對揚之寵褒踰華衮獲親奉於玉音業授青襟歸洊更於琯律重溫舊學益勵壯心一嵗九遷敢希異數中年再召遽困煩言却掃杜門疐後跋前之末免浮家泛宅擕幼扶老以何之塵埃蹤迹之已深霜雪鬢顔之如許食歎居間而不足力嗟就列以無能重以萋菲之言萃此萍蓬之迹折腰為米亦數免而稀遷捩手覆羮况多仇而寡與嵗月飇忽身世陸沉甚矣無揚子之一㕓蕭然立相如之四壁每自嗟艱難險阻敢復興念其他然凡有血氣心知誰忍無食而死強顔謀祿踵户扣人殆費營度之百方真可胡盧而一笑兹乘別駕偶在陪都虎踞龍蟠極東南之勝槩麟符魚鑰多左右之侍臣雖云材具之尋常願贊郡條之萬一實倒指而望嵗亦矯首而問天坐閲三秋去無幾日會有擇材之請靡容尸祿其間尚賴庇存猶未汰斥考龜卜筮方其涓吉而行秣馬膏車乃復望崖而返戍期尚隔未聞舊令尹之告新官稱猶存恍覺今將軍之如故稟生自薄造物何心瀝懇大鈞興衰末路恭惟某官精忠許國英識自天業履氷霜聳一時之標凖篇章黼黻接三代之源流炳先見蓍龜之明鍾信美江山之秀密勿天墀而謀猷屢告雍容澤國而威愛並行玉振金聲素擅膠庠之譽山庭淵角夙推廊廟之姿羣枉不容孤髙自立捫參歷井豈應蜀道之行曵履鳴珂遄列禁塗之邃進司銓院密侍經帷洊膺制綍之頒入總政機之重調元鼎鉉合德冕旒以魯國之真儒權衡斯道位姬旦之冡宰柱石本朝心侔天地之公政復祖宗之舊處至繁而聲色不動屹然社稷之宗臣應多變而籌䇿無遺偉矣旗常之懿績副聖主非常之眷為邦家莫大之休福祿來臻苖裔深逺重念某之久困世亦少倫雖碌碌稠衆人之中而了無一長然歷歷三十年之間而僅書四考憂令病劇力與年衰方清朝推從欲之仁而我公廣包荒之度適逢今日是告危衷俯念匏繫一紀之餘重隔瓜時再期之逺翳桑之下視蔭幾何且嵗方有秋已朝不謀夕一日復一日糟粳之飽未獲焉眀年又眀年餼廩雖優無及矣尚祈不資之厚賜拯此未盡之餘齡愛尺寸之膚忍自卑於桐梓得斗升之水猶有望於桑榆誓守官針仰酬化筆上宰相啓有幾餘生分沈淪於溝壑無邉洪造丐潤澤於雲霄念孤蹤未熟於門闌顧平日阻修於簡牘兹忘犯分庶遂陳情伏念某淮海飄零江湖僑寓燈火徒苦泥糟粕於古人翰墨非長較雕篆於童子莫望四科於闕里偶塵一第於漢廷帶經荷鋤經未眀而釋荷鋤之苦為親負米親不留而乖負米之心早被命於公車獲對揚於便殿蒙玉音之一字榮耀終身脫銓調之七階叨踰賤分退處泮宫之舊旋參幕府之遊一嵗九遷敢希異寵中年再召遽困煩言訟愆環堵之中絶意璿霄之上佐麾符於近地有慚別乘之功奉香火於真祠聊借散人之號念陳力就列不能者止唯投間置散乃分之宜旁觀或下石焉孤蹤如摧朽耳歸尋舊學加勵壯心身雖滯於窮途時難逢於休運風雲際會元首眀而股肱良哉乾坤清寧福祿臻而宗社安矣自念立相如之四壁初未有揚雄之一㕓聚族猥多不能供億逢辰既泰忍獨飄零兹乘別駕偶在陪都虎踞龍蟠極東西之重望麟符魚鑰皆左右之侍臣誓竭萬分坐閲三載今欲擇材而去不容備數其間尚賴并容未從擯斥姑令沙汰之在後亦如駑蹇之不前方既襆被而趨乃復自崖而返代期復隔姑存於舊令尹新令尹之間官稱尚存自覺有今將軍故將軍之異稟賦自薄造化非私方萬物各樂其生某也有此生而獨苦無一夫不得其所某也求其所而未安雖冥心九死之餘亦企踵再生之賜恭惟某官力扶宗社心契乾坤負剛毅敢為之氣而守以至謙積精深自得之學而持之無倦謂可以止則止可以仕則仕當無墜夫先聖之風念置諸安則安置諸危則危常自任以天下為重提衡正道推轂寒生心醉六經文尤贍蔚家藏萬卷手自校讎獨看松柏之後凋咸尊星鳯之先暏乃繇人望自結主知烏府抗章議論悉關於國體金華勸講敷陳允契於上心烈日秋霜威名共仰泰山北斗德望愈尊亟奉白麻進登黃閣行平時潔靜精微之學成今日彌縫輔贊之功亮采惠疇妙贊勳華之治守文應變兼收姚宋之長凡兹海宇之心咸謂朝廷之慶重念某生而多難世亦少倫雖俯仰稠衆人之中而了無一長然首尾三十載之間而僅書四考啼號盡室轉徙他鄉今嵗方有秋已朝不及夕一日復一日糟粳之飽未獲焉眀年又眀年餼廪之憂無及矣尚祈大賜拯此餘齡敬惟三吐哺三握髮之勤豈惜一舉手一投足之力仰萬間之廣厦何所不容託一枝於深林自今以始上宰執啓名汚丹筆負黃閣之陶鎔官寄赤城奉紫虛之香火索太倉而是懼立四壁以如初漸邇崇墉盡紓危悃伏念某了無足取非不自量眀堂登杞梓之材樗散何用清廟薦圭璋之器珉賤奚宜自埀童子之髫即擁門人之篲聞某所有賢者越百舍往從之不知嵗律之屢遷自恨天資之極陋進身闕里空遐想於四科射策漢廷偶末塵於一第釋耒農畝整冠仕塗時乎為貧豈憚擊柝抱關之冗親猶未老少資啜菽飲水之歡蒙天幸於化鈞承人乏於黌宇徒守聖賢之糟粕偶逃簿尉於塵埃歸卧蓴鄉旋參蓮幕龍蟠虎踞挹王氣於行都玉振金聲想餘風於故里無何命薄所至途窮訴平日之險艱纍千言而莫盡嗟此身之蹭蹬半百嵗以無多憶昨摳衣首初望履憂餘引分誰推轂於寒蹤望外承恩猥題輿於近郡覽紅蓼白萍之勝概尋浮家泛宅之舊遊嚮日維勤幸去天之咫尺戴星敢憚助守土之毫分嘗聞攝刺史之符唯欽奉聖朝之詔一書生綿力何有兩馮君餘愛具存廪粟帑金謹隄防於蟻漏箠令笞法絶煅煉於鼠穿深懲刻木之姦一仰伐柯之則弗鞭其後良愧於初擢髮何言噬臍永嘆百里之行九十末路奚堪五刑之屬三千隆恩莫報曲從輕比并逭深文至于寬糊口之憂當枵腹枯腸之日獲息肩之便於折肱埀翼之餘極知負道德之初心稍已還神眀之舊觀髙天厚地殆局蹐而罔容凌雨震風益帡幪之是賴恭惟某官力扶宗社心契乾坤罄辰告之嘉猷毗日躋之聖德圜冠句屨儒推闕里之真赤舄朱衣才擅周公之美以廣厦萬間庇寒士以千金一壺濟中流君將有為天實大任定廟算於都俞之頃靜邉塵於談笑之中贊贊巖廊炳堯舜文王之正道雍雍寰宇藹唐虞成周之泰和本一言可以興邦乃百樂生於治國旗常所紀簡册未聞誓帶礪於山河有國有家之共慶襲箕裘於弓冶若子若孫之相承重念某託命三槐脫身叢棘顛連萬態如前語之所云遮護千方恃我公而獲免擕數口窮簷之下馳一心台座之傍明哉元首而良哉股肱親逢聖旦暴之秋陽而濯之江漢阻侍師門自憐塵念之已灰獨愴前愆之未雪欲殫陳于一二懼取瀆於再三踴躍自鳴不如改過羈栖衆棄惟自省躬畫餅豈足以充飢吹虀不忘於懲沸飢寒併日疾痛呼天儻此生氛翳之既除即極目青霄之在望逖逺鵷鸞之列夢想鳴珂暫遲麋鹿之羣食聞炊玉冀載色載笑而匪怒庶三熏三沐而少安菲葑不遺桑榆有自日者已竊無功之祿心乎猶耻有道之貧誓飭微軀永依洪造再辱是懼無尺寸之膚不愛焉初願非他得斗升之水斯活矣陳情冒犯俟命戰兢上湖州王侍郎啓巖壑雖遙幸聞風之有日雲霄在望悵披霧之無期誰云開府之初即遂登門之便某學慙畫鵠技止雕蟲久諳世味於苦辛遍歷客途之險阻扶老携幼於干戈之際粵自埀髫跂前疐後於憂患之塗逮今華髮謂一行而作吏庶三釜之及親蠶則績而蟹有筐幸初偶爾木欲靜而風不止禍則隨之藐草野之餘生荷槐庭之再造置之別駕仍在名藩強麋鹿之冠巾雅知非稱雜簿書於魚鳥聊樂餘間駭煩言之驟興凛危蹤之何恃吹毛法寺方指摘於錙銖瀝血化鈞如照臨於咫尺一飲一啄三沐三薰歎糞墻朽木之何誅仰厚地隆天之莫報奉香火者兩嵗飽藜藿於一家懲羮吹虀每念前愆之洗廢食因噎忍令素志之虧雖噬臍之何追每指心而自誓前言往行願多識之遺俗故家不忘仰止何期今日自慰平生恭惟某官萬事蓍龜本朝麟鳯發六經之藴粲然華國之文膺九陛之知凛若鎮時之望羽儀要路冠冕郡公流風餘韻則真王謝家省事親心而師老莊氏總郊儀於冬祀時推顯相之勞髙法從於夏卿日賴論思之益屢矣抗疏暫此分符行路爭睹於旌麾指日頓銷於桴鼓提封何幸人皆有於二天識面為榮侯何輕於萬戶况如么麼久願依歸唯夢想於儀形遽親聞於罄咳道塗老矣每自歎於萍蓬墳廬在焉宜必恭於桑梓但念急頒於召節寧容久綰於郡章雖不忘重趼而來恐無幾承顔而去浮家泛宅尚時遊苕霅之之濵曵履鳴珂想即侍巖廊之邃姑慿尺牘用告寸心上孫參政啓誕布眀綸寵登碩輔真儒果用於魯國茂業可量大老既興於海濵輿情自定寰區共慶朝著生輝恭惟某官亷靖粹和髙眀久大絃歌璧水英詞蚤振於妙年領袖蓬山嘉譽獨推於當世灼見前哲之大體蔚為三朝之舊臣自入奉於清光殆遍儀於要路盡言無隱直道不回持槖禁塗告嘉猷於我后分符會府下膏澤於斯民視草北門馳車朔漠眷極侍臣之列寵躋常伯之聨老成重於典刑久繫羣心之望器識先於文藝兹為全德之英比解帥藩趣還詞苑雍容帝所方疏三接之榮密勿政扉即贊萬幾之重時逢多棘民未少休惟上聖臨御一紀于兹念中原隔絶千里而逺示菲食卑宫之儉躬櫛風沐雨之勤肆覲羣方緝熙丕緒有君如此未寬側席之憂捨公其誰倚俟巨川之濟佇聞渙號榮正鼎司竊觀前古願治之君必藉名世盛德之佐事有定論人無間言相與扶明主於艱難之餘用能定大業於談笑之頃矧伊今日事半古人三户亡秦乘民心之共憤五遷治亳幸天步之少安中夜以興寸陰可惜百里辟國時久思於召公十乘啓行人方歌於吉甫繼兹能事屬我宗公某蓬蓽門寒斗筲器淺空空何有妄希管豹之窺兀兀徒勞未發醯雞之覆材迂踈而何用分連蹇而自甘客路飄蓬晚與門人之列清朝推轂誤蒙國士之知每慙馳問之踈欣覩除書之下屬訟愆於田野空懷想於門闌峩冠文石之班想聞盛事環堵松江之上獲庇寒蹤嵗律崢嶸寒威凝沍仰念鈞衡之託益精寢餗之調與方帥啓分閫四川去國萬里曠日持久訖無成功終更亟還僅免大戾泛江流之洶湧冒暑氣之袢延稍就夷塗甫寧悸魄皆餘光之所被非始望之敢期恭惟某官克壯其猷不顯亦世入儀禁路惓惓獻納之忠出鎮遐藩凛凛綏懷之略其惟圖任乃允具瞻某夙荷心知久違音旨幸問津於治境將晉謁於元戎豈惟申悃愊之私庶或請誨言之益其為欣忭罔既敷陳與夔路王帥啓伏審奉承眀詔鎮撫遐藩下車云初闔境胥慶恭惟某官學優聖域望重儒宗直道而行曽靡居中之久為政以德復兹舉最之先所以無施不宜蓋其有本如是昔范公以給事而補外自番陽以待制而帥邉既步趨之適同亦名節之相似其惟圖任乃允具瞻某自顧拙疏夙蒙知照方幸同舟之濟遽勤賜教之臨向往之誠敷陳罔既與朝帥啓伏審欽承渙號全撫坤維郵音一傳輿論胥慶恭惟某官宏才任重敏識造微舒翹揚英特逹不依於繅藉批郤導窽從容皆中於宫商簡在淵衷進儀禁路謂遐邇之一體俾經營於四方緩帶輕裘已肅清於襄漢捫參歷井復深入於岷峨委寄益隆安危所繫少施餘力以訖外庸即膺圖任之求式副具瞻之望某承乏雖久曠瘝實多無以慰蜀父老之心何敢言楚令尹之政惟是辱知之有素今兹託契以為榮欣抃之誠敷陳罔既與湖州王給事啓上眷儒英中頒詔綍未逺長安之日帝眷方深來分刺史之天民情共慶凡兹闔境倚俟開藩矧惟么麼之蹤曽是知憐之素竊以據苕霅之會兹建侯邦自晉宋而來實稱道院有疊嶂重湖之清逺兼通都大邑之阜蕃華屋填城往往皆數百年之舊清香凝寢每每得二千石之良從昔名郊於今輔郡孰稱麾符之重寄政須簮槖之巨公恭惟某官專靜鎮浮真清激濁表裏純潔炯中扄之湛然內外踐更藹能聲之籍甚由布衣而著公輔之望覽黃卷而晤聖賢之心夙擅英聲亟登華貫早正郎星之次繼躋卿月之班畫戟朱轓恩沾數郡髙牙大纛威振十連遄歸再列於近班圖任益推於舊德盡言丹扆每傾嚮日之心批敕黃扉綽有回天之力謀猷有嘉則入告於內社稷茍利則知無不言宜政路之旋登亦輿言之允屬少緩三槐之拜來為泗水之遊抱逺業以徊翔擇樂郊而偃息浮家泛宅未營緑野之居五馬雙旌坐閲白蘋之勝尚虛丞相之席行趣舍人之裝某寥落晚生蹉跎末路綴姓名於龍虎榜回首幾年望光儀於鵷鷺行承顔異日去仭墻嵗月之久懷文室朝夕於心顧馳問之浸踈喜揚旌之伊邇道塗悴矣祗自厭於萍蓬墳廬在焉獲致恭於桑梓當蔭萬間之廣厦自託一枝於深林幸會良多欣躍無已與蘄州張倅啓間乃其分久安巖壑之居用非所長遽奉麾符之寄粵有名士實在同僚庶親議論之餘少逭譴訶之及伏惟某官飛英騰茂提要鈎元觀三代兩漢之書能守以約貫諸子百家之學每尊所間蔚為江左之勝流早馳海內之雋譽摶風擊水寧淹溝瀆之尋常就日望雲合侍軒墀之咫尺况久隆於人望宜自結於主知夫何長材之未施猶復餘刃之小試歌謡戴路共髙別乘之功譽望滿朝即慶鋒車之召遂膺時用益振家聲粉澤典章所賴燕公之力緣飾儒雅更傳京兆之風某本自疏庸加之遲暮適在長江之表偶叨一障之榮聞髙誼之凛然知危蹤之免矣徒索太倉之粟寧不知慙獲分蔀室之光敢以自賀指日即期於參候順時猶兾於保調問訊左史兼中書舍人啓迹踈龍坂尚飄梗於南州官在螭坳仍判花於西掖敻隔升沉之若此缺聞興寢之何如長夏江村念繩樞之暫寓薰風殿閣想綸省之餘間惟我醇儒膺時繁祉恭惟某官事業三代文章六經在韋布而憂天下之當憂由簡編而得古人之先得黃鍾大吕鏗鏘雅頌之音氷壺玉衡卓犖廟廊之具錐處囊者衆知其立見金滿籯者自耻於不如何意觸舟幾成按劔向非親擢於當寧誰令獨冠於在廷公議交歸髙名愈白知君子所養矣彌堅金石之心見聖人而師之自契風雲之會踐方丈蓬萊之勝為玉堂金馬之儲凡國人皆曰賢無廷臣出其右以淵源澄深為諸儒之倡而辨裁清婉兼二史之長順風疾呼聲逺馳於四表急流勇退章屢丐於一麾衆皆祝公長無去國蓋雅富經綸之略非但髙黼黻之辭面對燕間偉辰猷之備奏心嘉鯁亮仰日鑒之昭埀粵自望郎進登法從特逹顒卬之眷雍容供奉之班有舉必書不愧春秋之筆削入告於內更資朝夕之論思常楊逺避其詞鋒班馬寧誇於史筆獨當上意髙映朝紳直奏於前斷斷皆當時之務退言於後悻悻異鄙夫之為居多陳時政之書否則薦人才之疏主盟斯道推轂寒生堯舜孔周之所傳殆重興於今日富韓歐范之已往能繼美於此風伏念某生而戅愚飽於憂患近臣論薦蚤賜覲於雲天仇家謗傷久投間於草野叨榮華衮空老青衫忍圭玷之未磨尚玉音之可想然而未嘗得祿妻孥不知其有官耻於訴窮親交自憐其乏食已甘心於末路時矯首於崇墉似聞埀盡之孤蹤每指噓枯之餘論仭墻去久不以遐遺尺牘來疏知其病悴殊奬大踰於素願餘輝頓耀於窮途已玷齒牙更紓心腹疏庸自分非敢執求富之鞭羈栖無堪聊欲擊為貧之柝恩能及此念豈有他溝壑之辱有年儻終薦墨廟堂之登不日重入化鈞盡室號寒蓋無扊扅之在矣叩門觸熱寧無褦襶之譏乎問候太守啓上眷名藩增慎麾符之寄中頒寵數聿咨簮橐之英想閭里望公之來庶江山因人而重某官道德純備詩書淹該窮遊夏之淵源擅卿雲之黼黻由仁義而非行仁義獨眀往聖之心知春秋而罪以春秋自信平生之學蜚聲雍泮結眷冕旒烏府繩姦嗣鄉評于子隱螭坳記動推史筆於周任旋歸侍於家庭繼起臨於屛翰解印十年之久尚傳五袴之謡掩關一壑之幽自繫埀紳之望蓋難而後獲斯謂仁矣惟磨而不磷不曰堅乎兹由禁塗還紆郡紱暫辭近侍論思之列已無千里愁歎之聲皂蓋朱轓頓改吏民之觀衮衣赤舄佇期公輔之登某歷蚤嵗以承顔越衆人而蒙遇一經白首蠧書可慙二紀青衫索米何補荷異恩之起廢復大府之充員客夢頓驚深自憐於匏繫嵗華洊易恍莫記於瓜期言當問塗欣遂承庇恃有白日青天之鑒庶無震風凌雨之虞得二千石之良與闔境共霑於輝潤較三十里之智顧晚生曷贊於聰眀某敢不恪以居官誠於事長間以獄訟簿書之暇求聞忠信文行之規風日清和尚寢興之加慎山川修阻諒跋履之為勞問候平江守啓二天獨有頃蒙潤於繡衣一水相望兹聞名於畫戟嵗當再閏春有餘寒諒惟起處之宜茂對休祥之集恭惟某官盛時麟鳯慶閥芝蘭襲家風太末之餘分詩律江西之𣲖量凝千頃撓不濁而澄不清聲徹九臯發乎邇而見乎逺早埋輪於當道旋持槖於禁塗古循吏何以加狐狸安問大丈夫此之謂燕雀焉知宜登喉舌之司暫寄股肱之郡凡兹提封之千里共記持節之他時過漢于張民尚懷於仁恕維周申甫上允賴於藩宣况兹要衝雅稱都會惟南北朝之交好方絡繹於使旜念東西府之猶虛宜雍容於政路會須贊國行矣告廷某飄梗浮生負薪多病追往昔之咎顧靣壁以何言為知己之羞豈登門之敢望無復自通於簡牘乃聞曲借於齒牙喜極舂糧憂寬索飯願承顔於暇日及贊喜於新春詔演絲綸踵漢室三公之拜榜登龍虎掩徐卿二子之歌順風而前指期可賀回謝及第人啓妙中儒科榮登仕版公論所屬亨塗可量伏惟慶慰某人楩楠大厦之材圭璋清廟之器警悟不勞於師授該洽仍得之家傳果以妙齡膺兹遴選不在君門之第一尚鬱衆評久知國士之無雙佇觀逺業為掾聊追於三語寤主即聞於片言自惟萍梗之蹤偶玷葭莩之末方深贊喜遽辱惠音粲然追作者之風為之興嘆謙以敘門生之禮豈所宜蒙但增篋笥之光莫效瓊琚之報回第二人啓謝策楓宸登名桂籍妙中亞魁之選共欽稽古之榮伏以某官天地鍾和山川育秀淳厚爾雅文章追三代之餘直諒多聞聲譽冠諸儒之右卓然逺器偉以髙材較藝省闈已擅巍峩之第獻言丹陛益攄悃愊之忠力陳孝弟之言深贊治安之策搢紳動色共慶邦家之得賢師友聨名益見鄉閭之盛事某偶兹代匱竊預榮觀過辱長箋益欽雅眷愧乏瓊瑶之報但增篋笥之光回交代蘇計議啓錫命天墀觀風湖嶠仰惟澄清之素問豈及於狐狸俯矜沙汰之餘後無忘於瓦石粲然翰墨賁此衡茅伏惟某官文成一家學該百代襲祖風父風而芳芬如在問今事古事而酬應若流密畫與聞早贊樞衡之議要途直上宜參禁槖之華淹汩幾時嘆嗟萬口季子佩相國之印終振家聲孺文登刺史之車鬱隆人望尚遙魏闕暫託湘流往賡衡嶽之篇聊窮偉觀歸奉宣室之對寧久遐方但念隔一夕之秋風還復共千里之明月某自惟匏繫空數瓜時撫陋質以無堪知英遊之莫繼捫心自矢阻諧附驥之榮循分遄安獲免續貂之愧仰銜雅眷彌勵髙風書札踵門珠璣盈軸逺勤一介行李之至賢於十部從事之臨惟子文喜愠有常未遽絶於新令尹顧李廣數竒可笑敢自比於今將軍罔知圖報之宜深謝撝謙之過回蘄州教授啓孤飛未髙每自嗟於六翮屢薦不入乃遽竊於一麾不遑據義而辭獨有親仁之幸惟某官圭璋清廟之器楩柟大厦之材遡遊夏之淵源學窮聖域粲卿雲之黼黻文掞天庭以終賈之妙年擅蘇張之大手鴈序共題於鴈塔久歆艷於鄉閭鳯閣聳聽於鳯鳴尚徊翔於郡國思樂兹遊於泮水選掄即上於瀛州某撫隻影以何堪荷雙緘之見豫久隔異縣行遂同寮飽聞蘄水之濵最號芹宫之盛遊鄭僑之鄉校行聽弦誦之音即何武之學宫尚賴針規之益成我素志所望故人與教授啓青山白水之盟歸歟未遂皂蓋朱轓之寵老矣何堪重拜佳音仰欽雅眷伏惟某官器資凝重學術邃深兄弟並列於儒科已掩機雲之譽家世共推於賢業有光羣紀之傳了無俗吏之簿書合上諸公之臺省斯文振起多士鼎來某屏迹為深離羣兹久故人有幾當復見於儀刑餘習未除尚樂聞於弦誦庶以餘暇獲奉緒言回江陰薛知軍謝到任啓榮膺朝命出領郡符采吉日而見吏民揚仁風而布條教里都共慶黨友增輝恭惟某官才秀儒林望隆時輩蚤以賢關之彥常登册府之遊踐履為多尚未冠金馬玉堂之選聲猷益大當始於朱轓皂蓋之時視事云初辱書甚腆荷撝謙之已至慙伏謁之未遑諒無久淹即躋要近鳴玉曳履將入踐於華塗賣劔買牛宜速酬於雅志仰懷風味良切瞻依
